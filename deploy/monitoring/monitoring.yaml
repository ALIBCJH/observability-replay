# Prometheus and kube-state-metrics for a local cluster, in their own
# namespace. Nothing here changes the applications being watched.
#
#   kubectl apply -f deploy/monitoring/monitoring.yaml
#   kubectl delete namespace monitoring      # removes all of it
#   (the two ClusterRoles and ClusterRoleBindings are named monitoring-*)
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ---- kube-state-metrics: what the cluster says about each workload --------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
# Read-only, and only the four kinds the scorecards use.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-kube-state-metrics
subjects:
  - {kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-state-metrics}
  template:
    metadata:
      labels: {app: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          imagePullPolicy: IfNotPresent
          args:
            - --resources=pods,nodes,deployments,replicasets
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            periodSeconds: 5
          resources:
            requests: {memory: 32Mi}
            limits: {memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector: {app: kube-state-metrics}
  ports:
    - port: 8080
---
# ---- Prometheus ------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# Read-only: find the nodes, and read each kubelet's container metrics
# through the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-prometheus
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: monitoring}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        # Keep the labels kube-state-metrics sets (namespace, pod, container),
        # so they describe the workload and not the exporter.
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      # The service graph: request, failure and latency counts per pair of
      # services, worked out from traces by the collector below.
      - job_name: service-graph
        static_configs:
          - targets: ["otel-collector.monitoring.svc:8889"]

      # CPU, memory and throttling per container, from each kubelet's
      # built-in cAdvisor, reached through the API server.
      - job_name: cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  rules.yml: |
    groups:
      - name: workloads
        rules:
          - alert: ContainerRestarted
            expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
            labels:
              severity: warning
              service: "{{ $labels.container }}"
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted"
          - alert: ReplicasUnavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 30s
            labels:
              severity: critical
              service: "{{ $labels.deployment }}"
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  # One writer on the data directory at a time.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      # Root, because the data directory below is created by the kubelet as
      # root. Acceptable on a laptop cluster; use a real volume elsewhere.
      securityContext: {runAsUser: 0}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
            - --storage.tsdb.retention.size=500MB
            - --web.enable-lifecycle
            # A counter that first appears already at 12 would otherwise show
            # no increase: Prometheus never saw it at 0. This records a 0 at
            # the counter's creation time, so the first failures on a new
            # edge are counted.
            - --enable-feature=created-timestamp-zero-ingestion
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 400Mi}
      volumes:
        - name: config
          configMap: {name: prometheus}
        # A directory on the node, so history survives a pod restart and a
        # `k3d cluster stop`/`start`. It is lost with `k3d cluster delete`.
        - name: data
          hostPath:
            path: /var/lib/rancher/k3s/prometheus-data
            type: DirectoryOrCreate
---
# ---- OpenTelemetry Collector: traces in, service-graph metrics out ----------
# Applications send spans here (OTLP over HTTP, port 4318). The servicegraph
# connector pairs each client span with the server span it caused and counts
# requests, failures and latency per pair. Prometheus scrapes the result on
# port 8889. The spans themselves are not stored anywhere.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      # The graph should show network hops between services, once each.
      filter/hops:
        error_mode: ignore
        traces:
          span:
            # SDKs that describe the same call a second time at a higher
            # level (an MCP request, a model call). Counting them too would
            # double the traffic and draw edges that skip proxies.
            - instrumentation_scope.name == "mcp-python-sdk"
            - IsMatch(instrumentation_scope.name, "^anthropic")
            # Not traffic: kubelet readiness probes, and a page's event
            # stream that stays open for as long as the page does.
            - attributes["url.path"] == "/healthz"
            - attributes["url.path"] == "/api/state"
            - attributes["url.path"] == "/api/events"
    connectors:
      service_graph:
        latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s, 60s]
        store:
          ttl: 5s
          max_items: 5000
        # A call to something that sends no spans of its own (a database,
        # an outside API) is drawn as a node named by one of these.
        virtual_node_peer_attributes: [db.system, server.address]
        metrics_flush_interval: 15s
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        # With this the exporter says when each counter was created, which
        # Prometheus needs to count a failure series' very first failures
        # (see --enable-feature below).
        enable_open_metrics: true
    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        traces:
          receivers: [otlp]
          processors: [filter/hops]
          exporters: [service_graph]
        metrics:
          receivers: [service_graph]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4318
            - containerPort: 8889
          readinessProbe:
            tcpSocket: {port: 4318}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 200Mi}
      volumes:
        - name: config
          configMap: {name: otel-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-http, port: 4318}
    - {name: metrics, port: 8889}
---
# No laptop port is mapped for this (that needs the cluster recreated), so
# reach it on the node's own address: see deploy/monitoring/prom-url.sh.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector: {app: prometheus}
  ports:
    - port: 9090
      nodePort: 30090
