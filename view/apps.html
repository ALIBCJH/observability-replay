<!doctype html>
<html lang="en">

<title>Application scorecards</title>

<body>
<div id="app" class="wide">
  <div id="nav" class="bar" hidden>

      <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="var(--accent)"/><path d="M4 13h4l2.5-6 3.5 10 2.5-6H20" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Observability replay

    <nav class="tabs" aria-label="Views">
      <a href="apps-preview.html" aria-current="page">Applications</a>

      <a href="benchmark-preview.html">Benchmark</a>

  </div>

  <header class="head">
    <h1>Applications</h1>
    <p id="meta" class="muted"></p>
  </header>

  <p id="empty" class="surface notice muted" hidden></p>

  <p id="summary" class="muted" hidden></p>

  <section id="fleet" aria-label="All applications" hidden>
    <div id="rows"></div>
  </section>

  <section id="detail" class="surface" aria-live="polite" hidden></section>

  <details id="queries" hidden>
    <summary>Source queries</summary>
    <dl id="querylist"></dl>
  </details>
