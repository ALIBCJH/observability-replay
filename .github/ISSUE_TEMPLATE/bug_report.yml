name: Bug report
description: Something gives a wrong result, fails, or looks broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, internal hostnames or real monitoring data. Use made-up names.
        For a security problem, follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, tool calls or a small synthetic example. If it shows with `OBS_BACKEND=demo`, say so.
      render: text
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Application scorecards
        - Incident replay
        - Benchmark (observe)
        - Benchmark (active test)
        - Prometheus adapter
        - MCP server or tools
        - Other
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend
      description: demo, or the product and version behind the Prometheus API.
      placeholder: Prometheus 3.x, Mimir, VictoriaMetrics, demo
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: output of node --version
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client, if one is involved
